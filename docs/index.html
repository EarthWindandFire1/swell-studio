<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swell Studio</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6fc; color: #28304b; font: 1rem/1.6 system-ui, sans-serif; }
    main { width: min(32rem, 82vw); }
    h1 { margin: 0; font: 3.5rem/1.1 Georgia, serif; }
    p { margin-block: 1rem 1.5rem; }
    a { display: inline-block; margin: .25rem .75rem .25rem 0; }
    .launch { padding: .7rem 1.2rem; border-radius: .6rem; color: white; background: #555f91; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Swell Studio</h1>
    <p>Create a marketing poster from your product details, then save and download it from your library.</p>
    <a class="launch" href="https://swell-studio.onrender.com/">Open Swell Studio</a>
    <a href="https://github.com/EarthWindandFire1/swell-studio">View source</a>
  </main>
</body>
</html>
